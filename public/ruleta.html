<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruleta Vortex</title>
  <link rel="stylesheet" href="/ruleta.css?v=resultado">
  <script src="/ruleta.js?v=sectores-color" defer></script>
</head>
<body class="roulette-page">
  <main class="roulette-game">
    <a href="/">Volver a la tienda</a>
    <h1>Ruleta Vortex</h1>
    <p>Ingresa tu código de giro. Si lo recibiste al pagar por Yape, podrás usarlo cuando confirmemos tu pago.</p>
    <form id="spin">
      <label for="code">Código de giro</label>
      <input id="code" placeholder="VX-…" maxlength="35" required autocomplete="off" spellcheck="false">
    </form>
    <div class="wheel-frame">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="640" height="640" aria-hidden="true"></canvas>
      <button id="roulette-spin-button" class="roulette-spin-button" type="submit" form="spin" aria-label="Girar ruleta">Girar</button>
    </div>
    <p id="roulette-detail" class="roulette-detail" role="status" hidden></p>
    <p id="status" role="status"></p>
    <dialog id="reward" aria-labelledby="roulette-result-title" aria-describedby="prize">
      <h2 id="roulette-result-title">Resultado</h2>
      <p id="prize"></p>
      <p id="roulette-test-result" hidden>Giro de prueba, sin cupón canjeable.</p>
      <div id="roulette-coupon">
        <label for="coupon">Cupón para canjear por WhatsApp</label>
        <input id="coupon" readonly>
        <button id="copy" type="button">Copiar cupón</button>
      </div>
      <form method="dialog"><button type="submit" autofocus>Cerrar resultado</button></form>
    </dialog>
    <ol id="roulette-options" class="roulette-options" role="list" aria-label="Opciones de la ruleta" hidden></ol>
  </main>
</body>
</html>
